name: Download Dify Images

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and Save Images
        run: |
          # 拉取镜像
          docker pull --platform linux/amd64 langgenius/dify-api:1.12.1
          docker pull --platform linux/amd64 langgenius/dify-sandbox:0.2.12
          docker pull --platform linux/amd64 langgenius/dify-plugin-daemon:0.5.3-local
          docker pull --platform linux/amd64 postgres:15.19-alpine
          docker pull --platform linux/amd64 redis:6.2.24-alpine
          docker pull --platform linux/amd64 nginx:latest
          docker pull --platform linux/amd64 ubuntu/squid:latest
          docker pull --platform linux/amd64 semitechnologies/weaviate:1.27.0

          # 单独执行保存，不接管道，报错能直接看到
          docker save -o dify-images.tar \
            langgenius/dify-api:1.12.1 \
            langgenius/dify-sandbox:0.2.12 \
            langgenius/dify-plugin-daemon:0.5.3-local \
            postgres:15.19-alpine \
            redis:6.2.24-alpine \
            nginx:latest \
            ubuntu/squid:latest \
            semitechnologies/weaviate:1.27.0

          # 压缩
          gzip -1 dify-images.tar

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: dify-images
          path: dify-images.tar.gz
