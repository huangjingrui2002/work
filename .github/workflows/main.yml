name: Download Nacos AMD64 Slim Image

on:
  workflow_dispatch:
    inputs:
      nacos_version:
        description: 'Nacos version tag (e.g., v3.2.4)'
        required: true
        default: 'v3.2.4'

jobs:
  download-nacos-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull Slim Nacos (linux/amd64)
        run: |
          VERSION=${{ github.event.inputs.nacos_version }}
          # ✅ 替换为社区轻量版镜像，基于Alpine+JRE，体积约800MB
          SLIM_IMAGE="wuyue/nacos-server-alpine:${VERSION}"
          
          echo "Pulling slim image: ${SLIM_IMAGE} ..."
          docker pull --platform linux/amd64 "${SLIM_IMAGE}"

          # ✅ 校验架构
          ARCH=$(docker inspect --format='{{.Architecture}}' "${SLIM_IMAGE}")
          echo "Pulled architecture: ${ARCH}"
          if [ "${ARCH}" != "amd64" ]; then
            echo "::error::Expected amd64 but got ${ARCH}"
            exit 1
          fi

      - name: Save & Compress Image
        run: |
          VERSION=${{ github.event.inputs.nacos_version }}
          SLIM_IMAGE="wuyue/nacos-server-alpine:${VERSION}"
          docker save "${SLIM_IMAGE}" | gzip > nacos-${VERSION}-slim-amd64.tar.gz
          ls -lh nacos-${VERSION}-slim-amd64.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nacos-${{ github.event.inputs.nacos_version }}-slim-amd64-tar-gz
          path: nacos-${{ github.event.inputs.nacos_version }}-slim-amd64.tar.gz
          retention-days: 7
