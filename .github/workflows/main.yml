name: Download JDK 8 Image (x86_64)

on:
  workflow_dispatch: # 允许手动触发

jobs:
  download-jdk8:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Official JDK 8 Image (x86_64)
        # 拉取标准的 x86_64 版本 JDK 8
        # 这里使用的是 Eclipse Temurin，目前最主流的 OpenJDK 发行版
        run: |
          docker pull eclipse-temurin:8-jdk

      - name: Save Image as Tar
        # 将镜像保存为 tar 包
        run: |
          docker save eclipse-temurin:8-jdk -o jdk8-x86.tar

      - name: Upload Artifact
        # 上传文件供你下载
        uses: actions/upload-artifact@v4
        with:
          name: jdk8-x86-tar
          path: jdk8-x86.tar
