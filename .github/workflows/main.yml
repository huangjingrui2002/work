name: Download Redis 7.4.10 AMD64

on:
  workflow_dispatch:

jobs:
  download-redis-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Redis 7.4.10 (linux/amd64)
        run: |
          docker pull --platform linux/amd64 redis:7.4.10

      - name: Save Image as Tar
        run: |
          docker save redis:7.4.10 -o redis-7.4.10-amd64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: redis-7.4.10-amd64-tar
          path: redis-7.4.10-amd64.tar
