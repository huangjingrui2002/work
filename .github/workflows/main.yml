name: Download Nacos AMD64 Image

on:
  workflow_dispatch:
    inputs:
      nacos_version:
        description: 'Nacos version tag (e.g., v3.2.4)'
        required: true
        default: 'v3.2.4'   

jobs:
  download-nacos-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull Nacos (linux/amd64)
        run: |
          VERSION=${{ github.event.inputs.nacos_version }}
          echo "Pulling nacos/nacos-server:${VERSION} ..."
          docker pull --platform linux/amd64 nacos/nacos-server:${VERSION}

          # ✅ 校验架构
          ARCH=$(docker inspect --format='{{.Architecture}}' nacos/nacos-server:${VERSION})
          echo "Pulled architecture: ${ARCH}"
          if [ "${ARCH}" != "amd64" ]; then
            echo "::error::Expected amd64 but got ${ARCH}"
            exit 1
          fi

      - name: Save & Compress Image
        run: |
          VERSION=${{ github.event.inputs.nacos_version }}
          docker save nacos/nacos-server:${VERSION} | gzip > nacos-${VERSION}-amd64.tar.gz
          ls -lh nacos-${VERSION}-amd64.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nacos-${{ github.event.inputs.nacos_version }}-amd64-tar-gz
          path: nacos-${{ github.event.inputs.nacos_version }}-amd64.tar.gz
          retention-days: 7
