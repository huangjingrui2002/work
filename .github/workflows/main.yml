name: Build Slim Nacos AMD64 Image

on:
  workflow_dispatch:
    inputs:
      nacos_version:
        description: 'Nacos version tag (e.g., v3.2.4)'
        required: true
        default: 'v3.2.4'

jobs:
  build-slim-nacos-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Slim Dockerfile
        run: |
          VERSION=${{ github.event.inputs.nacos_version }}
          # 去掉版本号前缀 'v'，用于下载链接
          NACOS_VER=${VERSION#v}
          
          cat > Dockerfile <<EOF
          FROM eclipse-temurin:17-jre-alpine AS builder
          ARG NACOS_VERSION=${NACOS_VER}
          RUN apk add --no-cache curl tar bash && \
              curl -fSL https://github.com/alibaba/nacos/releases/download/\${NACOS_VERSION}/nacos-server-\${NACOS_VERSION}.tar.gz -o /tmp/nacos.tar.gz && \
              mkdir -p /opt/nacos && \
              tar -xzf /tmp/nacos.tar.gz -C /opt/nacos --strip-components=1 && \
              rm -f /tmp/nacos.tar.gz && \
              # 清理不必要的文件以进一步减小体积
              rm -rf /opt/nacos/conf/*.sql /opt/nacos/bin/*.bat /opt/nacos/LICENSE /opt/nacos/NOTICE
          
          FROM eclipse-temurin:17-jre-alpine
          LABEL maintainer="slim-nacos-builder"
          COPY --from=builder /opt/nacos /opt/nacos
          ENV JAVA_HOME=/opt/java/openjdk \
              PATH="/opt/java/openjdk/bin:/opt/nacos/bin:\$PATH" \
              MODE=standalone \
              PREFER_HOST_MODE=hostname
          WORKDIR /opt/nacos
          EXPOSE 8848 9848 9849
          ENTRYPOINT ["bin/docker-startup.sh"]
          EOF

      - name: Build Slim Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: nacos-slim:${{ github.event.inputs.nacos_version }}-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify & Show Size
        run: |
          TAG="nacos-slim:${{ github.event.inputs.nacos_version }}-amd64"
          echo "=== Image Info ==="
          docker inspect --format='Architecture: {{.Architecture}} | Size: {{.Size}}' "$TAG"
          docker images "$TAG"
          
          ARCH=$(docker inspect --format='{{.Architecture}}' "$TAG")
          if [ "${ARCH}" != "amd64" ]; then
            echo "::error::Expected amd64 but got ${ARCH}"
            exit 1
          fi

      - name: Save & Compress Image
        run: |
          TAG="nacos-slim:${{ github.event.inputs.nacos_version }}-amd64"
          docker save "$TAG" | gzip > nacos-${{ github.event.inputs.nacos_version }}-slim-amd64.tar.gz
          ls -lh nacos-${{ github.event.inputs.nacos_version }}-slim-amd64.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nacos-${{ github.event.inputs.nacos_version }}-slim-amd64-tar-gz
          path: nacos-${{ github.event.inputs.nacos_version }}-slim-amd64.tar.gz
          retention-days: 7
