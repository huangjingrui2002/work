name: Download Redis 7.4.10 ARM64

on:
  workflow_dispatch:

jobs:
  download-redis-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Redis 7.4.10 (linux/arm64)
        run: |
          docker pull --platform linux/arm64 redis:7.4.10

      - name: Save Image as Tar
        run: |
          docker save redis:7.4.10 -o redis-7.4.10-arm64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: redis-7.4.10-arm64-tar
          path: redis-7.4.10-arm64.tar
