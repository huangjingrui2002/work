name: Download Nacos AMD64 Slim Image

on:
  workflow_dispatch:
    inputs:
      nacos_version:
        description: 'Nacos version tag (e.g., v3.2.4)'
        required: true
        default: 'v3.2.4'

jobs:
  download-nacos-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull Official Nacos (linux/amd64)
        run: |
          VERSION=${{ github.event.inputs.nacos_version }}
          echo "Pulling nacos/nacos-server:${VERSION} ..."
          docker pull --platform linux/amd64 nacos/nacos-server:${VERSION}

          ARCH=$(docker inspect --format='{{.Architecture}}' nacos/nacos-server:${VERSION})
          echo "Pulled architecture: ${ARCH}"
          if [ "${ARCH}" != "amd64" ]; then
            echo "::error::Expected amd64 but got ${ARCH}"
            exit 1
          fi

      - name: Slim Image Locally
        run: |
          VERSION=${{ github.event.inputs.nacos_version }}
          IMAGE="nacos/nacos-server:${VERSION}"
          
          # ✅ 一行命令瘦身：删除文档、示例、源码包等无用文件
          docker run --rm "${IMAGE}" sh -c "
            rm -rf /home/nacos/conf/*.example \
                   /home/nacos/plugins/custom \
                   /home/nacos/logs/* \
                   /home/nacos/target/nacos-server.jar.original \
                   /home/nacos/bin/*.cmd \
                   /home/nacos/NOTICE /home/nacos/LICENSE /home/nacos/README.md
          "
          
          # 将清理后的容器提交为新镜像
          CONTAINER_ID=$(docker create "${IMAGE}" sh -c "
            rm -rf /home/nacos/conf/*.example \
                   /home/nacos/plugins/custom \
                   /home/nacos/logs/* \
                   /home/nacos/target/nacos-server.jar.original \
                   /home/nacos/bin/*.cmd \
                   /home/nacos/NOTICE /home/nacos/LICENSE /home/nacos/README.md
          ")
          docker start "${CONTAINER_ID}" || true
          docker commit "${CONTAINER_ID}" nacos-slim:${VERSION}-amd64
          docker rm "${CONTAINER_ID}"

      - name: Save & Compress Slim Image
        run: |
          VERSION=${{ github.event.inputs.nacos_version }}
          docker save nacos-slim:${VERSION}-amd64 | gzip > nacos-${VERSION}-slim-amd64.tar.gz
          ls -lh nacos-${VERSION}-slim-amd64.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nacos-${{ github.event.inputs.nacos_version }}-slim-amd64-tar-gz
          path: nacos-${{ github.event.inputs.nacos_version }}-slim-amd64.tar.gz
          retention-days: 7
