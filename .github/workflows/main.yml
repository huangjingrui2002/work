name: Download Nacos 3.2.4 AMD64 (for x86)

on:
  workflow_dispatch:

jobs:
  download-nacos-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Nacos 3.2.4 (linux/amd64)
        run: |
          # 👇 改为 amd64，这才是 x86 需要的
          docker pull --platform linux/amd64 nacos/nacos-server:3.2.4

      - name: Save Image as Tar
        run: |
          docker save nacos/nacos-server:3.2.4 -o nacos-3.2.4-amd64.tar

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nacos-3.2.4-amd64-tar
          path: nacos-3.2.4-amd64.tar
