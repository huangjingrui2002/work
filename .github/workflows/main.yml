name: Download PostgreSQL 17.11 Image

on:
  workflow_dispatch: # 允许手动触发

jobs:
  download-postgres:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Official PostgreSQL 17.11 Image (x86_64)
        # 显式指定 linux/amd64 平台，确保拉取的是 x86 版本
        run: |
          docker pull --platform linux/amd64 postgres:17.11

      - name: Save Image as Tar
        # 将镜像保存为 tar 包
        run: |
          docker save postgres:17.11 -o postgres-17.11-amd64.tar

      - name: Upload Artifact
        # 上传 tar 包文件供你下载
        uses: actions/upload-artifact@v4
        with:
          name: postgres-17-11-amd64-tar
          path: postgres-17.11-amd64.tar
